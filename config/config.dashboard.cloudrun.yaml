# Tradex ops dashboard on Cloud Run (read-only). Serves two lanes, ASX ETF and
# NSE rotator, each rendering a report object from GCS. Secrets via ${ENV};
# never commit real values.

env: "demo"
project: "fxtrade-prod-12345"

dashboard:
  listen_addr: ":8080"
  mock: false
  auth:
    mode: "bearer"
    token: "${DASHBOARD_TOKEN}"
  # Report objects are read straight from GCS by the ETF and NSE lanes; the
  # dashboard has no broker, ledger or status backend.
  cache_ttl: { overview: 60s }
  ui: { refresh_interval: 20s, reporting_tz: "UTC" }
