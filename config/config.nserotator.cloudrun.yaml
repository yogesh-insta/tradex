# NSE momentum rotator — Cloud Run config (docs/specs/20-nse-momentum-rotator.md).
# Advisory-only: no broker connectivity, no order placement.
env: prod

nserotator:
  lookback_months: 6
  top_k: 10
  # Exit hysteresis: sell only when outside the top exit_rank_n on BOTH
  # the 6m and 12m lists. exit_rank_n == top_k restores plain rotation.
  exit_lookback_months: 12
  exit_rank_n: 30
  regime_ema_days: 200
  # Regime filter OFF: stay invested through downtrends. Backtest 2010-2026 on
  # this exact config — filter on 35.6% CAGR / -13.3% max DD / 112x, filter off
  # 45.6% CAGR / -28.1% max DD / 338x. The filter costs ~10 points of CAGR and
  # also halves the exit hysteresis' turnover benefit (8.6% -> 19.2% per month)
  # because a forced liquidation overrides every hold decision. Deliberately
  # trading a deeper drawdown for ~3x terminal wealth; flip to true to restore
  # the gate. See docs/specs/20-nse-momentum-rotator.md § Regime filter.
  regime_filter: false
  universe_file: config/universe-nse200.yaml
  holidays_file: config/holidays-nse.yaml
  market: XNSE
  # portfolio.json (user-maintained), heartbeat.json and
  # recommendation-YYYY-MM.json live under this prefix.
  gcs_prefix: gs://tradex-demo-state/nserotator
  yahoo_timeout_s: 30
  drift_check: true
  excluded_symbols:
    - ADANIENSOL
    - ADANIENT
    - ADANIGREEN
    - ADANIPORTS
    - ADANIPOWER

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
