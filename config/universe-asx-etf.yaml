# ASX ETF universe for the monthly momentum monitor (spec 21).
#
# Source of truth: kite/betashares/screen.py FUNDS dict (the validated Python
# screener). Every ticker there appears here, regrouped from Betashares' own
# marketing categories into the five groups the monitor actually reasons about.
# Yahoo symbol = <ticker>.AX.
#
# as-of: 2026-07-22 (betashares.com.au/fund/ + IPAY, which that page omits).
# Refresh via config PR; the drift check warns when the live list diverges.
#
# Groups (normative, spec 21 §Universe):
#   standard  ranked for the top 10. Equity, thematic, commodity, smart-beta,
#             global, diversified, equity-income. The only group that can be
#             recommended.
#   geared    2-3x leveraged long. Ranked in a separate section — leverage tops
#             a momentum table on its own and that is not a signal.
#   inverse   bear/short funds. NEVER ranked among long momentum.
#   fx        currency bets. Separate section with geared.
#   excluded  cash and bonds. Not ranked at all; momentum is meaningless here.
#
# Non-Betashares issuers are tagged so the report can say "buyable via broker".

