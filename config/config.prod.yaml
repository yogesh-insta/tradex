# Tradex — prod environment (tradex-prod GCP project, OANDA fxtrade = LIVE).
# Live trading is gated by which host + credentials are loaded, never a flag.
# Secrets are ${ENV_VAR} references resolved at boot (Secret Manager →
# EnvironmentFile on the VM); never put values here.

env: "prod"
project: "tradex-prod"

oanda:
  host: "api-fxtrade.oanda.com"          # LIVE host — real money
  stream_host: "stream-fxtrade.oanda.com"
  token: "${OANDA_API_TOKEN}"

# Multi-account model: one OANDA sub-account per market/category.
# Each account groups instruments, assigns one strategy, and may override risk.
accounts:
  - name: "eu-indices"
    oanda_account_id: "${OANDA_ACCOUNT_ID_EU}"
    instruments: ["DE30_EUR", "FR40_EUR"]
    strategy: "eu_love"
    active: true
    # risk:                       # optional per-account overrides
    #   daily_loss_limit: 150

  # --- staged examples (inactive) showing the multi-account model ---
  # - name: "us-indices"
  #   oanda_account_id: "${OANDA_ACCOUNT_ID_US}"
  #   instruments: ["NAS100_USD", "SPX500_USD"]
  #   strategy: "us_sweep"        # future: resting-limit sweep strategy
  #   active: false
  # - name: "fx-majors"
  #   oanda_account_id: "${OANDA_ACCOUNT_ID_FX}"
  #   instruments: ["EUR_USD", "GBP_USD"]
  #   strategy: "fx_momentum"     # future
  #   active: false
  #   risk:
  #     risk_per_trade: 0.005
  #     daily_loss_limit: 100

stream:            # 02-market-data-stream.md (instruments derived from accounts)
  heartbeat_timeout: 15s
  stale_halt: 60s
  backoff_base: 1s
  backoff_max: 60s
  tick_channel_buffer: 4096

candles:           # 03-candle-builder.md
  price: "M"
  timeframes:
    DE30_EUR: ["H1", "M5"]
    FR40_EUR: ["H1", "M5"]
  window_max: 50
  rest_confirm_delay: 2s
  rest_confirm_timeout: 5s

eu_session:        # 04-eu-session-controller.md (times = Europe/Berlin wall clock)
  tz: "Europe/Berlin"
  range_start: "08:00:00"
  range_end: "09:00:00"
  trade_window_start: "09:05:00"
  atr_period_days: 14
  vol_ma_candles: 12
  instruments: ["DE30_EUR", "FR40_EUR"]

strategies:
  eu_love:         # 05-strategy-eu-love.md
    volume_spike_mult: 1.0
    sl_atr_mult: 0.5
    tp_atr_mult: 1.5
    breakeven_at_r: 1.0
    entry_window_end: "11:00:00"

risk:              # 06-risk-management.md (global defaults; overridable per account)
  risk_per_trade: 0.01
  daily_loss_limit: 150
  consecutive_loss_halt: 3
  max_concurrent: 1
  max_margin_frac: 0.10
  max_leverage: 5.0
  news_block_before: 30m
  correlation_groups:
    - ["DE30_EUR", "FR40_EUR"]

executor:          # 07-order-executor.md
  time_in_force: "FOK"
  request_timeout: 5s
  max_retries: 3
  retry_backoff_base: 250ms

mgmt:              # 08-trade-management-loop.md
  tick_interval: 2s
  reconcile_interval: 20s
  news_block_before: 30m
  eu_friday_cutoff: "17:30:00"
  eu_daily_cutoff: ""            # empty = none (v1)

control_plane:     # 09-control-plane.md
  listen: ":8443"
  auth:
    secret: "${CONTROL_HMAC_SECRET}"
    max_skew: 60s
    nonce_ttl: 300s
  allow_cidrs: ["ADMIN_IP/32"]  # restrict to admin source ranges
  tls_cert: "/etc/tradex/tls/cert.pem"   # TLS terminates on the VM
  tls_key: "/etc/tradex/tls/key.pem"

calendar:          # 10-economic-calendar.md
  economic:
    provider: "file"             # "gcs" once the poller sidecar exists
    state_file: "data/calendar-state.json"
    gcs_object: "gs://tradex-prod-state/calendar-state.json"
    vm_refresh: 5m
    staleness_max: 90m
    high_impact_only: true
    regions: ["EU"]
  holidays:
    file: "config/holidays.yaml"
    markets: ["XETR", "XPAR"]

persistence:       # 11-trade-ledger-persistence.md (stdout publisher in v1)
  topics:
    trades: "trade-events"
  buffer_size: 8192
  flush_timeout: 5s

observability:     # 12-observability-and-alerts.md
  heartbeat_interval: 30s
  liveness_timeout: 120s
  reconcile_interval: 20s
  drawdown_warn: 120
  alert_topic: "alerts"
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

backtest:
  initial_equity: 5000
  spread_points: 1.2             # full spread in index points (DE30/DAX typical)
  slippage_points: 0.5           # adverse slippage per fill
  data_dir: "data/candles"
  output_dir: "out"

dashboard:         # 14-dashboard.md (Cloud Run read-only ops UI)
  listen_addr: ":8080"
  auth:
    mode: "iap"                  # prefer IAP in prod; bearer also supported
    token: "${DASHBOARD_TOKEN}"  # unused when mode=iap
    # iap_allow_emails: ["ops@example.com"]
  gcs:
    calendar_object: "gs://tradex-prod-state/calendar-state.json"
    status_object: "gs://tradex-prod-state/status.json"
  bigquery:
    project: "tradex-prod"
    dataset: "tradex"
    table: "trade_ledger"
  cache_ttl: { overview: 60s, calendar: 60s, pl: 180s }
  ui: { refresh_interval: 20s, pl_daily_lookback_days: 30, reporting_tz: "UTC" }
  health: { heartbeat_stale: 120s, tick_stale: 60s, calendar_stale: 90m }
