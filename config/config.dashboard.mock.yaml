# Minimal config for local dashboard UI demos (no OANDA/GCS/BigQuery).
#   export DASHBOARD_TOKEN=dev
#   go run ./cmd/dashboard --config config/config.dashboard.mock.yaml
#   open http://localhost:8080/?token=dev

env: "dev"
project: "tradex-dev"

dashboard:
  listen_addr: ":8080"
  mock: true
  auth:
    mode: "bearer"
    token: "${DASHBOARD_TOKEN}"
  cache_ttl: { overview: 60s }
  ui: { refresh_interval: 20s, reporting_tz: "UTC" }
