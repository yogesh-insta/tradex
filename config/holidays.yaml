# Trading holidays / half-days — checked-in config per docs/specs/10 (§B).
#
# BEST-EFFORT PLACEHOLDER for 2026: validate yearly against the official
# exchange calendars before go-live:
#   - XETR (Xetra/Eurex, DE30 (Germany 40/DAX)): https://www.deutsche-boerse.com  trading calendar
#   - XPAR (Euronext Paris, FR40): https://www.euronext.com  trading calendar
# Weekends are always treated as closed; only exchange holidays go here.

year: 2026

markets:
  XETR:                       # Xetra / Eurex — DE30_EUR
    tz: "Europe/Berlin"
    holidays:
      - "2026-01-01"          # New Year's Day
      - "2026-04-03"          # Good Friday
      - "2026-04-06"          # Easter Monday
      - "2026-05-01"          # Labour Day
      - "2026-12-24"          # Christmas Eve (exchange closed)
      - "2026-12-25"          # Christmas Day
      - "2026-12-31"          # New Year's Eve (exchange closed)
    half_days: []

  XPAR:                       # Euronext Paris — FR40_EUR
    tz: "Europe/Paris"
    holidays:
      - "2026-01-01"          # New Year's Day
      - "2026-04-03"          # Good Friday
      - "2026-04-06"          # Easter Monday
      - "2026-05-01"          # Labour Day
      - "2026-12-25"          # Christmas Day
    half_days:
      - date: "2026-12-24"    # early close
        close: "14:05:00"
      - date: "2026-12-31"    # early close
        close: "14:05:00"
