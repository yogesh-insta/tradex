name: Deploy

# Manual deploys only. Uses GitHub Environments (demo / prod) so prod can
# require reviewers. Secrets per environment:
#   GCP_VM_HOST      — VM external IP or hostname
#   GCP_VM_USER      — SSH user (e.g. tradex-deploy)
#   GCP_VM_SSH_KEY   — private key for that user (deploy-only)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [demo, prod]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Pre-deploy checks (never ship red)
        run: |
          go vet ./...
          go test ./...
          go build ./cmd/trader ./cmd/backtester

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.GCP_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build, restart on VM
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}"             "sudo chown -R \$(id -un):\$(id -gn) /opt/tradex && bash /opt/tradex/deploy/scripts/deploy.sh ${{ inputs.environment }}"
