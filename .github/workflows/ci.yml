name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: go test (race)
        run: go test -race ./...

      # Every command, named or not — the previous per-command steps went stale
      # the moment the live trading engine was removed.
      - name: build all commands
        run: go build ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [dashboard, nserotator, etfmonitor, calendarpoller]
    steps:
      - uses: actions/checkout@v4

      - name: docker build ${{ matrix.service }}
        run: |
          docker build -f deploy/docker/Dockerfile.${{ matrix.service }} \
            -t tradex-${{ matrix.service }}:ci .
